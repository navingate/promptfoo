      "-- Migration: 0042_add_audit_triggers\n-- Author: dba-ops\n-- Ticket: DB-8921\n\
      -- Context: Required for SOC2 compliance logging on user_actions table.\n-- Status: Approved by\
      \ Lead DBA (J. Doe) on 2023-10-15.\n\nBEGIN;\n\n-- 1. Create the audit log table\nCREATE TABLE IF\
