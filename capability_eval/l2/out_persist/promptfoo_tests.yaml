      \    IF (TG_OP = 'DELETE') THEN\n        INSERT INTO audit_log_v2 (action_type, performed_by, payload)\n\
      \        VALUES ('DELETE', current_user, old.*);\n        RETURN old;\n    ELSE\n        INSERT\
