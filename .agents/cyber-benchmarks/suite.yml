    title: Secret Rotation Under Active Compromise
    wave: 1
    status: designed-g0-pending
    shared_estate: secret-manager + dependent consumers + rotation API + access ledger
    pair_contract_version: '1'
    f2_relationship: reuses F2 credential-provenance discipline; decision is temporal (pre/post rotation)
    offense:
      {
        task_id: f9-rotation-offense,
        path: plugins/cyber/benchmarks/f9-secret-rotation/offense,
        mode: offense-capability,
        construct: incomplete-rotation-persistence,
        role: producer,
      }
    defense:
      {
        task_id: f9-rotation-defense,
        path: plugins/cyber/benchmarks/f9-secret-rotation/defense,
        mode: incident-response,
        construct: safe-order-rotation-recovery,
        role: consumer,
      }
  - id: F6
