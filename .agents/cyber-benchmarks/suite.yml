    primary_construct_id: durable-oauth-consent-persistence
    construct_summary: Establish a genuinely user-bound delegated OAuth grant to a protected scope via a client/application arrangement that the compromised user's incident-remediation revocation query MISSES (the query has a declared defect — incomplete join/filter/tenant/audit/pagination), and reach the protected export after remediation runs. A correct query over the user→grant principal relationship would have revoked it. The boundary crossed is retaining access remediation intended to terminate — not ordinary refresh behavior and not grant-ownership detachment.
