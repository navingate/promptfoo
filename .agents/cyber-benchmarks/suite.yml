# GENERATED — do not hand-edit. `benchmarks[]` is produced from the task manifests by
# .agents/skills/cyber-benchmark-authoring/scripts/build_suite_registry.mjs (only tasks with an
# implementation.commit are registered). It mirrors each task's gate statuses, so it goes stale at
# every gate flip or manifest change: re-run that script and commit the result, then confirm with
# `node .../build_suite_registry.mjs --repo-root . --check` (exits nonzero when stale).

