# Portfolio anchor + the nine F3-F11 paired families.
# Source of truth: next-nine-chains.md (selection + waves) and design-correction.md (architecture).
# `families` is a descriptive roadmap the auditor ignores. Per-task binding records go in
# `benchmarks[]` only at build time, because each record must bind a real implementation commit and
# existing gate evidence (audit_benchmark validateSuite) — neither exists at G0-pending.
anchor:
  id: F2
  title: Enterprise Identity-to-Cloud Takeover
  note: Deep identity-to-cloud chain; the suite's reference anchor. Lives in the halobench-offense skill.

families:
  - id: F9
    title: Secret Rotation Under Active Compromise
    wave: 1
    status: designed-g0-pending
    shared_estate: secret-manager + dependent consumers + rotation API + access ledger
    pair_contract_version: '1'
    f2_relationship: reuses F2 credential-provenance discipline; decision is temporal (pre/post rotation)
    offense:
      {
        task_id: f9-rotation-offense,
        path: plugins/cyber/benchmarks/f9-secret-rotation/offense,
        mode: offense-capability,
        construct: incomplete-rotation-persistence,
        role: producer,
      }
    defense:
      {
        task_id: f9-rotation-defense,
        path: plugins/cyber/benchmarks/f9-secret-rotation/defense,
        mode: incident-response,
        construct: safe-order-rotation-recovery,
        role: consumer,
      }
  - id: F6
    title: Poisoned Change Request
    wave: 1
    status: designed-g0-pending
    shared_estate: change-agent harness + privileged tools + untrusted document sources + action ledger
    pair_contract_version: '1'
    f2_relationship: independent; shares F2 out-of-plane-ledger scoring discipline
    offense:
      {
        task_id: f6-change-offense,
        path: plugins/cyber/benchmarks/f6-poisoned-change/offense,
        mode: offense-capability,
        construct: injected-infra-change,
        role: producer,
      }
    defense:
      {
        task_id: f6-change-defense,
        path: plugins/cyber/benchmarks/f6-poisoned-change/defense,
        mode: tool-conduct,
        construct: change-agent-injection-conduct,
        role: consumer,
      }
  - id: F4
    title: Durable Consent
    wave: 1
    status: designed-g0-pending
    shared_estate: IdP + OAuth consent plane + protected API + approved-app population + access ledger
    pair_contract_version: '1'
    f2_relationship: adjacent to F2 identity-federation; distinct decision (delegation persistence across reset)
    offense:
      {
        task_id: f4-consent-offense,
        path: plugins/cyber/benchmarks/f4-durable-consent/offense,
        mode: offense-capability,
        construct: durable-oauth-consent-persistence,
        role: producer,
      }
    defense:
      {
        task_id: f4-consent-defense,
        path: plugins/cyber/benchmarks/f4-durable-consent/defense,
        mode: defense-detection,
        construct: malicious-grant-vs-approved-app,
        role: consumer,
      }
  - id: F10
    title: Sanctioned-Channel Exfiltration
    wave: 2
    status: planned
    f2_relationship: reuses F2 data-asset-egress discipline; emphasis on cumulative-sequence judgement
    offense: { mode: offense-capability, role: producer }
    defense: { mode: defense-detection, role: consumer }
  - id: F7
    title: Cross-Tenant Support Boundary
    wave: 2
    status: planned
    f2_relationship: identity-federation adjacent; confused-deputy / tenant-binding decision
    offense: { mode: offense-capability, role: producer }
    defense: { mode: tool-conduct, role: consumer }
  - id: F8
    title: Recovery Plane Sabotage
    wave: 2
    status: planned
    f2_relationship: independent; destructive-action + recoverability decision
    offense: { mode: offense-capability, role: producer }
    defense: { mode: incident-response, role: consumer }
  - id: F3
    title: Workload Identity Cascade
    wave: 3
    status: planned
    f2_relationship: deep technical anchor alongside F2; k8s/workload-identity composition
    offense: { mode: offense-capability, role: producer }
    defense: { mode: defense-detection, role: consumer }
  - id: F5
    title: Trusted Build, Untrusted Source
    wave: 3
    status: planned
    f2_relationship: independent; supply-chain provenance composition
    offense: { mode: offense-capability, role: producer }
    defense: { mode: defense-detection, role: consumer }
  - id: F11
    title: Poisoned Incident Evidence
    wave: 3
    status: planned
    f2_relationship: capstone; reuses native events/artifacts from earlier families
    offense: { mode: offense-capability, role: producer }
