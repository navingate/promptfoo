      G3:
        - evidence/g3.yml
      G4:
        - evidence/g4.yml
      G5:
        - evidence/g5.yml
      G6: []
      G7: []
    calibration_result: calibration/result.yml
    approved_claim_path: plugins/cyber/benchmarks/f4-durable-consent/defense/evidence/approved-claim.txt
    explicit_nonclaims:
