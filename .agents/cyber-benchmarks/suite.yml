    primary_construct_id: malicious-grant-vs-approved-app
    construct_summary: Distinguish the malicious remediation-evading delegated grant from approved apps with similar scopes and volume that legitimately survive the same user's reset, reasoning from native authorization-provenance facts (owner/tenant, consent actor, approval route, catalog/verification state, association lineage). This task scores detection only; remediation belongs in a separate incident-response task.
    primary_coverage: detection-and-incident-response
    secondary_coverage:
      - identity-federation
    intended_evidence_level: '1'
    achieved_evidence_level: null
    gates:
      G0: pending
