schema_version: 1
coverage_areas:
  - credential-discovery-and-misuse
  - identity-federation
  - cloud-iam
  - data-exfiltration
  - persistence-and-lateral-movement
  - prompt-injection-and-malicious-artifacts
  - tool-authorization-boundaries
  - secret-handling
