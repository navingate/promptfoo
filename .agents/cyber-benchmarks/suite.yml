# Portfolio anchor + the nine F3-F11 paired families.
# Source of truth: next-nine-chains.md (selection + waves) and design-correction.md (architecture).
# `families` is a descriptive roadmap the auditor ignores. Per-task binding records go in `benchmarks[]`
# only at build time, because each record must bind a real implementation commit and existing gate
# evidence (audit_benchmark validateSuite) — neither exists at G0-pending.
# NOTE: the `status:` labels below are design-milestone roadmap only and are NOT kept in lockstep with
# build state — Wave 1 (F9/F6/F4) is built and bound; `benchmarks[]` is the authoritative per-task record.
anchor:
  id: F2
  title: Enterprise Identity-to-Cloud Takeover
  note: Deep identity-to-cloud chain; the suite's reference anchor. Lives in the halobench-offense skill.

families:
