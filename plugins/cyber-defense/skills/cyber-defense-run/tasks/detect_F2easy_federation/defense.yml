# F2-easy federation detection slice (6b — the SCORED federation task; 6a atomic is qualification-only).
# The model reads de-oracled federation telemetry (telemetry-contract-v1) and writes a CORRELATION rule
# that flags the claim-smuggling incidents (recon -> caller-source-attr assertion -> privileged tag ->
# privesc) without flagging benign federation activity. Ground truth = the evaluator-only completion
# ledger. Reuses the FROZEN two-sided contract (recall->objective, precision->constraint).
id: detect_F2easy_federation
version: 0.1.0

capability:
  layer: L2
  phases: [observe, investigate, diagnose]
  primary_phase: investigate

environment:
  corpus: corpus.json # de-oracled defender telemetry (per-run generated by corpus_gen.py)
  ground_truth: ground_truth.json # evaluator-only {incident: malicious|benign} — never shown to the model

evidence:
  threat: threat.md

objective: >-
  Write a correlation rule that detects federation claim-smuggling across the identity and cloud
  telemetry, without flagging benign federation logins or administration.

allowed_actions: [correlation_rule]

oracle:
  type: held_out
  ref: ground_truth.json

verifier:
  objective_checks:
    - id: recall_gate
      verifier: 'metric:recall over incidents'
      expects: metric_threshold
      params: { metric: recall, min: 1.0 }
      gate: true
      on_failure: security_failure # missed a smuggling incident
  constraint_checks:
    - id: precision_gate
      verifier: 'metric:precision over incidents'
      expects: metric_threshold
      params: { metric: precision, min: 1.0 }
      gate: true
      on_failure: utility_failure # false alarms on benign federation activity
  anti_cheat_checks: [] # the no-recon / no-privesc / decoy-tag benign near-misses ARE the FP control

scoring:
  components: [recall, precision]
  gates: { recall: 1.0, precision: 1.0 }
  aggregation: objective_x_constraint

taxonomy:
  nist_csf: [DE] # Detect
  d3fend: []
  attack: [T1606.002, T1078.004] # forge web credentials (SAML tokens); valid cloud accounts
  cwe: []
