# Cyber DEFENSE — F2 federation CORRELATION detection task, run through promptfoo (v1.2).
#
# The SUT is a standard chat model: the prompt presents the threat brief (attack + de-oracled event schema
# + the full rule grammar + the SOC config it may reference via {"$config": <key>}); the model returns a
# correlation rule (JSON); the python assertion scores it over the HELD-OUT corpus with the frozen
# two-sided grader (recall -> objective, precision -> constraint) and reports raw recall/precision/f1 PLUS a
# timing diagnostic (pre_privesc_rate: how much of the attack the rule catches before escalation). A model
# may write the response-grade escalation-join rule OR the preventive honored-tag rule (referencing
# `honored_tag` from its SOC config) — the latter catches the smuggle at the tag-landing, before escalation.
# Pure-stdlib scorer — no Docker. Live model calls are user-run.
#
# ── Run against the three calibration models (Chutes, OpenAI-compatible). From the REPO ROOT: ──
#   export CHUTES_API_KEY=...            # or put it in the repo .env and add --env-file .env
#   npm run local -- eval \
#     -c "$PWD/plugins/cyber-defense/skills/cyber-defense-run/promptfooconfig.correlation.yaml" \
#     --no-cache --repeat 10 \
#     -o /tmp/f2_defense_correlation.json
#   # --repeat 10 = the offense-style N-run pass-rate (fraction of attempts that write a detecting rule).
#   # For one deterministic rule per model instead, drop --repeat and set temperature: 0 below.
#   npm run local -- view -y     # or inspect /tmp/f2_defense_correlation.json (per-model pass/score/reason)
#
# Model ids are the Chutes catalog names the offense calibration used (model field "openai/glm-5.3" etc.).
# If a name 404s, correct it here — GLM-5.2's exact catalog id in particular is worth confirming.
description: Cyber DEFENSE — F2 federation correlation detection (v1.2)

providers:
  - id: openai:chat:openai/DeepSeek-V4-Flash
    label: DeepSeek-V4
    config:
      apiBaseUrl: https://llm.chutes.ai/v1
      apiKeyEnvar: CHUTES_API_KEY
      temperature: 0.7
      max_tokens: 4000
  - id: openai:chat:openai/glm-5.2
    label: GLM-5.2
    config:
      apiBaseUrl: https://llm.chutes.ai/v1
      apiKeyEnvar: CHUTES_API_KEY
      temperature: 0.7
      max_tokens: 4000
  - id: openai:chat:openai/glm-5.3
    label: GLM-5.3
    config:
      apiBaseUrl: https://llm.chutes.ai/v1
      apiKeyEnvar: CHUTES_API_KEY
      temperature: 0.7
      max_tokens: 4000

prompts:
  - file://prompts/correlation_prompt.py:build_prompt

tests:
  - description: detect_F2easy_federation
    assert:
      - type: python
        value: file://assert_correlation.py
