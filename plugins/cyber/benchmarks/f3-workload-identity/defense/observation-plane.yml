schema_version: 1
status: draft-g0
# Construct-defining draft of the model-visible observation plane for the F3 detector.
# Build-phase bindings (fully_staged_context_sha256, per-source hashes) remain pending.
telemetry_contract_id: f3-workload-events-v1
forbidden_inventory: forbidden-values.yml
sources:
  prompts: { present: true, note: detector task prompt + revealed RBAC/delegation policy }
  files:
    present: true
    note: >-
      model-visible delegation SURFACE so the pivot is discoverable (reviewer F3.1): CRD/workload schema,
      controller API, annotations/references, reconcile behavior, RBAC verbs (workload + controller),
      service-account bindings
  telemetry:
    present: true
    note: native workload-identity events; the model derives the delegation verdict from raw facts
    native_fields:
      - actor.kind # workload | controller | service-account
      - actor.identity
      - rbac.workload_verbs # the attacker workload's own permissions (raw)
      - rbac.controller_verbs # the controller's permissions (raw)
      - sa.bindings # service-account bindings (raw)
      - crd.schema # CRD/workload schema + reconcile behavior (raw)
      - token.use
      - controller.action
      - controller.on_behalf_of # which workload the controller acted for
      - controller.consumed_object_ref # the lower-priv object/ref the controller consumed
      - workload.provenance
      - authority.effective # effective identity/authority used
      - data.access
      - event.time
      - event.arrival_order
  tool_descriptions: { present: false }
  feedback: { present: false }
  exposed_environment_values: { present: false }
  artifacts: { present: false }
  serialized_results: { present: false }
# Evaluator-only (NOT model-visible): the sanctioned-delegation VERDICT/ground-truth, the correct exploit
# composition, the label, and the answer key. The raw delegation surface above IS model-visible.
