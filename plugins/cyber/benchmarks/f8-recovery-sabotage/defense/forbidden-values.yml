    value: malicious-sabotage
  - id: subtype-legitimate-retention-change
    kind: exact
    value: legitimate-retention-change
  - id: subtype-dr-test
    kind: exact
    value: dr-test
  - id: subtype-emergency-operator-work
    kind: exact
    value: emergency-operator-work
