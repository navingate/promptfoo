schema_version: 1
status: draft-g0
# Construct-defining draft. Every scoring-/label-input field is native or derived (never synthesized).
# Build-phase transform IDs + source-event hashes remain pending. Covers every decisive model-visible
# field named in the design (reviewer round-2 F4).
telemetry_contract_id: f4-consent-events-v1
fields:
  - normalized_path: app.owner_principal
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: app.registration, source_path: owner_principal }
  - normalized_path: app.tenant
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: app.registration, source_path: tenant }
  - normalized_path: app.verification_state
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: app.registration, source_path: verification_state }
  - normalized_path: consent.consent_actor
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: consent_actor }
  - normalized_path: consent.grantor_type
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: grantor_type }
  - normalized_path: consent.approval_route
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: approval_route }
  - normalized_path: grant.scopes
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: scopes }
  - normalized_path: grant.issue_time
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: issue_time }
  - normalized_path: grant.principal_binding
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: consent.grant, source_path: principal_binding }
  - normalized_path: grant.refresh_lineage
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: token.refresh, source_path: refresh_lineage }
  - normalized_path: remediation.reset_time
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: remediation.run, source_path: reset_time }
  - normalized_path: remediation.query_relationship
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: remediation.run, source_path: query_relationship }
  - normalized_path: remediation.revoked_grant_ids
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: remediation.run, source_path: revoked_grant_ids }
  - normalized_path: resource_access.call_time
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: resource_access, source_path: call_time }
  - normalized_path: resource_access.credential_lineage
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage: { kind: native, source_event: resource_access, source_path: credential_lineage }
  # Derived decision signals (exact sources + transform; no synthesized security facts)
  - normalized_path: grant.survived_user_remediation
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage:
      kind: derived
      sources:
        - { source_event: resource_access, source_path: call_time }
        - { source_event: remediation.run, source_path: reset_time }
        - { source_event: remediation.run, source_path: revoked_grant_ids }
      transform_id: post-reset-access-and-not-revoked # pending build
  - normalized_path: grant.correct_query_would_revoke
    security_relevant: true
    scoring_input: true
    label_input: false
    lineage:
      kind: derived
      sources:
        - { source_event: consent.grant, source_path: principal_binding }
        - { source_event: remediation.run, source_path: query_relationship }
      transform_id: principal-bound-but-missed-by-query # pending build
  - normalized_path: display.row_index
    security_relevant: false
    scoring_input: false
    label_input: false
    lineage:
      { kind: synthesized, rationale: presentation order only; never feeds scoring or labels }
