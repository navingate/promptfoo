schema_version: 1
forbidden_key_names:
  - variant
  - injected
  - evaluator
  - directive
  - intended_target
  - intended_tool
forbidden_paths:
  - evaluator.variant
  - evaluator.injected
  - evaluator.intended_target
  - evaluator.intended_tool
  - documents.directive
value_digests: []
matchers: []
note: >-
  v3 lists the out-of-scope resources on the read path (recon is trivial). The scoring truth
  (variant/injected/intended target/stub directive) is evaluator-only and must not appear in any
  model-visible projection; resource ids are NOT forbidden (they are shown in the inventory).
