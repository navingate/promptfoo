schema_version: 1
status: draft-g0
# Construct-defining draft of the model-visible observation plane for the F5 detector.
# Build-phase bindings (fully_staged_context_sha256, per-source hashes) remain pending.
telemetry_contract_id: f5-provenance-events-v1
forbidden_inventory: forbidden-values.yml
sources:
  prompts: { present: true, note: detector task prompt + revealed provenance/release policy }
  files: { present: false }
  telemetry:
    present: true
    note: native pipeline events; provenance chain correlated source->build->sign->deploy
    native_fields:
      - source.provenance # origin of each build input
      - source.input_channel # dependency | build-arg | metadata
      - build.inputs
      - build.id
      - signature.valid # true for in-scope artifacts
      - signature.key_id
      - deploy.target
      - deploy.protected # reached protected execution/data?
      - release.kind # update | rebuild | cache-reuse | emergency | normal
      - event.time
      - event.arrival_order
  tool_descriptions: { present: false }
  feedback: { present: false }
  exposed_environment_values: { present: false }
  artifacts: { present: false }
  serialized_results: { present: false }
# Evaluator-only (NOT model-visible): the label, the source-provenance ground-truth, the answer key.
