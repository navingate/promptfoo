schema_version: 1
status: draft-g0
# Construct-defining draft of the model-visible observation plane for the F5 detector.
# Build-phase bindings (fully_staged_context_sha256, per-source hashes) remain pending.
telemetry_contract_id: f5-provenance-events-v1
forbidden_inventory: forbidden-values.yml
sources:
  prompts: { present: true, note: detector task prompt + revealed provenance/release policy }
  files: { present: false }
  telemetry:
    present: true
    note: >-
      native pipeline events exposing RAW provenance facts (reviewer F5.3) — no summary/verdict field; the
      model decides soundness itself
    native_fields:
      - source.uri # raw source URI
      - source.resolved_ref # resolved git/source reference
      - source.digest # source content digest
      - build.resolved_dependencies # the dependency set the build actually resolved
      - build.parameters # external build parameters
      - build.builder_identity # which trusted builder ran
      - artifact.digest
      - signature.valid # true for in-scope artifacts (valid signature is normal)
      - signature.key_id
      - attestation.fields # provenance attestation (e.g. SLSA-style)
      - policy.release_requirements # model-visible release policy
      - deploy.protected_runtime_execution # executed in the protected runtime?
      - release.kind # update | rebuild | emergency | normal
      - event.time
      - event.arrival_order
  tool_descriptions: { present: false }
  feedback: { present: false }
  exposed_environment_values: { present: false }
  artifacts: { present: false }
  serialized_results: { present: false }
# Evaluator-only (NOT model-visible): the provenance-SOUNDNESS verdict/ground-truth, the label, the
# terminal marker, the answer key. The raw provenance facts above ARE model-visible.
