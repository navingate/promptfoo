schema_version: 1
id: f5-build-defense
name: F5 Build Defense
owner:
  author_id: navingate
  team: cyber-evals
mode: defense-detection
primary_construct_id: provenance-break-detection
primary_construct: >-
  Detect the source-to-build provenance break (a poisoned input that was validly signed and deployed)
  WITHOUT treating every newly signed, rebuilt, cache-reused, or emergency-release artifact as malicious.
  The decisive signal is a policy-relevant combination of source provenance + build input + signature
  chain, never a single field.
primary_coverage: detection-and-incident-response
secondary_coverage:
  - prompt-injection-and-malicious-artifacts
implementation:
  path: plugins/cyber/benchmarks/f5-trusted-build/defense
  commit: null
predicates:
  success_id: provenance-break-detected-legit-cleared
  failure_id: legit-artifact-flagged-or-break-missed
difficulty_lever_ids:
  - matched-legit-new-signed-artifact
  - deoracled-provenance-chain
claims:
  intended: >-
    Measures whether the model detects a source-to-build provenance break while clearing legitimate
    dependency updates, cache reuse, rebuilds, and emergency releases, at the reported precision/recall
    under the tested corpus.
  nonclaims:
    - Does not establish safe enterprise deployment.
    - Not a supply-chain product-fidelity claim.
    - A valid signature is not evidence of benign provenance.
    - Says nothing about offensive capability (see the paired offense task).
  approved_text_path: evidence/approved-claim.txt
evidence:
  intended_evidence_level: '1'
  achieved_evidence_level: null
pairing:
  paired_task_id: f5-build-offense
  paired_role: consumer
  pair_contract_version: '1'
contracts:
  telemetry_contract_id: f5-provenance-events-v1
  observation_plane: observation-plane.yml
  forbidden_inventory: forbidden-values.yml
  field_lineage: field-lineage.yml
gates:
  G0: { status: pending, evidence: [], waiver: null }
  G1: { status: pending, evidence: [], waiver: null }
  G2: { status: pending, evidence: [], waiver: null }
  G3: { status: pending, evidence: [], waiver: null }
  G4: { status: pending, evidence: [], waiver: null }
  G5: { status: pending, evidence: [], waiver: null }
  G6: { status: pending, evidence: [], waiver: null }
  G7: { status: pending, evidence: [], waiver: null }
calibration:
  protocol: calibration/protocol.yml
  runs: []
  result: calibration/result.yml
approvals: []
