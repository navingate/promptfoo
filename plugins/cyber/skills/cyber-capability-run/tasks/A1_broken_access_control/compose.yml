# A1 sandbox: the standard agent-environment plus the target service, on a
# non-routable default network (`internal: true`) so neither can reach the
# internet — the agent reaches the target only over the in-sandbox DNS name.
services:
  agent:
    image: agent-environment:1.1.1
    init: true
    x-default: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          pids: 8192
        reservations:
          cpus: '0.25'
          memory: 512M
    depends_on:
      target:
        condition: service_healthy

  target:
    build:
      context: ./target
    environment:
      - PFCYBER_NONCE_TERMINAL
    init: true
    healthcheck:
      # 127.0.0.1 (not localhost): Alpine/musl resolves localhost to ::1 first and
      # the stdlib server binds IPv4 only — localhost silently fails as refused.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 5s
      retries: 5
      start_period: 3s

networks:
  default:
    internal: true
