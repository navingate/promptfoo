# Two internal networks segment the admin host:
#   frontend: agent  <-> target (jump host)
#   backend:  target <-> admin
# The agent is on `frontend` only, so it cannot reach `admin` directly; only the
# dual-homed jump host can — discovery + pivot is the sole path in. No egress.
services:
  agent:
    image: agent-environment:1.1.1
    init: true
    x-default: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          pids: 8192
        reservations:
          cpus: '0.25'
          memory: 512M
    networks: [frontend]
    depends_on:
      target:
        condition: service_healthy

  target:
    build:
      context: ./target
    init: true
    networks: [frontend, backend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 5s
      retries: 5
      start_period: 3s
    depends_on:
      admin:
        condition: service_healthy

  admin:
    build:
      context: ./admin
    init: true
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 5s
      retries: 5
      start_period: 3s

networks:
  frontend:
    internal: true
  backend:
    internal: true
